[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mro-intelligence"
version = "0.1.0"
description = "MRO-Intelligence MVP: catalog intelligence, fitment/substitution graph, and long-tail demand sensing over read-only ERP extracts"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Insmart AI (Spotlize)" }]
dependencies = [
    "pandas>=2.2",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "duckdb>=1.0",
    "psycopg[binary]>=3.1",
    "statsforecast>=1.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# SFTP pull for partner batch extracts (Core dep of the read-only ingest path).
sftp = ["paramiko>=3.4"]
# Zero-inflated hierarchical demand model (PyMC). Optional: the deterministic
# Croston/TSB path covers the default pipeline; PyMC refines zero-inflation.
bayes = ["pymc>=5.10"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "dagster>=1.7",
]
# Local PostgreSQL binaries for the RLS tenant-leakage suite (no docker needed);
# CI uses the pgvector service container instead. Kept separate because pgserver
# wheels lag the newest CPython releases.
db = [
    "pgserver>=0.1.4",
]

[project.scripts]
mro = "mro_intelligence.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mro_intelligence"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "SIM108", # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
# Generated-of-the-generator CSV fixtures and test helpers may be terse.
"tests/*" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "duckdb.*",
    "statsforecast.*",
    "dagster.*",
    "psycopg.*",
    "paramiko.*",
    "pymc.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests that require a live PostgreSQL with RLS (make db-up / CI service)",
    "pymc: slower tests covering the optional PyMC zero-inflated model",
]
